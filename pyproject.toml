[project]
name = "verityai_saas"
version = "0.9.0"
description = "Customer SaaS layer for the Verity AI engine"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"

[deploy.dependencies.apt]
packages = ["tesseract-ocr", "poppler-utils"]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"
